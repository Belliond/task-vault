name: Notify Telegram

# =========================================================
#  Pesan ke Telegram:
#    - 08.00 WIB tiap hari : tugas LMS baru + deadline
#                            H-3 sampai H-1
#    - Senin 08.00 WIB     : ditambah digest mingguan
#                            (tugas minggu ini + selesai
#                            minggu lalu)
#    - tiap jam menit :05  : pengingat 3 jam sebelum
#                            deadline (hanya tugas berjam)
#
#  Token bot hanya ada di secret runner, tidak pernah masuk
#  halaman web.
#
#  Secret: TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID,
#          SUPABASE_URL, SUPABASE_KEY
# =========================================================

on:
  schedule:
    - cron: "0 1 * * *"
    - cron: "5 * * * *"

  workflow_dispatch:
    inputs:
      mode:
        description: "Jenis pesan"
        type: choice
        options:
          - harian
          - deadline
        default: harian
      dry_run:
        description: "Tampilkan pesan, jangan kirim"
        type: boolean
        default: false
      uji:
        description: "Kirim pesan tes saja"
        type: boolean
        default: false

concurrency:
  group: notify-telegram
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Test
        run: node scripts/test-notify.mjs

      - name: Kirim
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          MODE="${{ inputs.mode }}"

          if [ "${{ github.event.schedule }}" = "5 * * * *" ]; then
            MODE=deadline
          fi

          if [ -z "$MODE" ]; then
            MODE=harian
          fi

          if [ "${{ inputs.uji }}" = "true" ]; then
            node scripts/notify-telegram.mjs --uji
          elif [ "${{ inputs.dry_run }}" = "true" ]; then
            node scripts/notify-telegram.mjs --dry-run --mode=$MODE
          else
            node scripts/notify-telegram.mjs --mode=$MODE
          fi
