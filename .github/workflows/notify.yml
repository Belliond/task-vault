name: Notify Tugas

# =========================================================
#  Notifikasi tugas, dikirim ke WhatsApp nomor utama.
#
#  Alurnya:
#    1. Runner ini membaca tugas dari Supabase
#    2. Pesan dititipkan ke tabel wa_outbox
#    3. Jembatan di HP mengambil titipan itu dan
#       mengirimnya lewat WhatsApp ke nomor utama
#
#  Runner GitHub tidak bisa memanggil HP secara langsung,
#  jadi tabel antrean itulah perantaranya. Kalau HP sedang
#  mati, pesan menunggu di antrean (maksimal 24 jam) dan
#  terkirim begitu HP hidup lagi.
#
#  SIAPA YANG MEMICU?
#  Bukan jadwal di file ini lagi. Jadwal utama ada di
#  database: pg_cron menjalankan public.picu_notify_github()
#  pada 08.07 WIB, lalu pg_net memanggil API GitHub untuk
#  memicu workflow ini.
#
#  Kenapa dipindah? Jadwal `schedule` di GitHub sering
#  tertunda dan kadang dilewati. Diuji di repo ini: dalam
#  ~23 jam seharusnya ada ~24 run, yang terjadi cuma 3, dan
#  tidak satu pun jatuh pada jam yang dijadwalkan. Notifikasi
#  08.00 WIB tidak pernah terkirim.
#
#  Jadwal di bawah ini DIPERTAHANKAN sebagai cadangan kalau
#  pg_cron mati. Karena itu scripts/notify-telegram.mjs
#  punya pengaman anti-dobel: pesan harian hanya dikirim
#  sekali per tanggal WIB, walau terpicu dari dua arah.
#
#  Telegram hanya salinan/arsip. Matikan dengan
#  NOTIFY_TELEGRAM=0 kalau tidak perlu.
#
#  Secret: SUPABASE_URL, SUPABASE_KEY,
#          TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID
# =========================================================

on:
  schedule:
    # CADANGAN SAJA. Pemicu utama ada di pg_cron
    # (public.picu_notify_github, 08.07 WIB).
    #
    # Jangan diandalkan: jadwal GitHub sering tertunda atau
    # dilewati. Pengaman anti-dobel di scripts/notify
    # telegram.mjs mencegah pesan dobel kalau keduanya
    # menyala pada hari yang sama.
    - cron: "0 1 * * *"
    - cron: "5 * * * *"

  workflow_dispatch:
    inputs:
      mode:
        description: "Jenis pesan"
        type: choice
        options:
          - harian
          - deadline
        default: harian
      dry_run:
        description: "Tampilkan pesan, jangan kirim"
        type: boolean
        default: false
      uji:
        description: "Kirim pesan tes saja"
        type: boolean
        default: false
      tunggu:
        description: "Pesan tes: tunggu bukti terkirim dari HP (90 detik)"
        type: boolean
        default: false
      kirim_telegram:
        description: "Kirim salinan ke Telegram juga"
        type: boolean
        default: true
      paksa:
        description: "Kirim ulang walau hari ini sudah pernah dikirim"
        type: boolean
        default: false
      tanggal:
        description: "Simulasi tanggal (YYYY-MM-DD). Kosong = hari ini"
        type: string
        default: ""

concurrency:
  group: notify-telegram
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Test
        run: node scripts/test-notify.mjs

      - name: Kirim
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_NAMA: ${{ secrets.TELEGRAM_NAMA }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          MODE="${{ inputs.mode }}"

          if [ "${{ github.event.schedule }}" = "5 * * * *" ]; then
            MODE=deadline
          fi

          if [ -z "$MODE" ]; then
            MODE=harian
          fi

          # Simulasi tanggal, untuk memeriksa isi pesan pada hari
          # lain tanpa menunggu hari itu tiba.
          TANGGAL=""

          if [ -n "${{ inputs.tanggal }}" ]; then
            TANGGAL="--tanggal=${{ inputs.tanggal }}"
          fi

          # Kirim ulang walau hari ini sudah pernah dikirim.
          # Dipakai saat menguji jadwal, karena pengaman
          # anti-dobel akan melewati pesan yang sudah terkirim.
          PAKSA=""

          if [ "${{ inputs.paksa }}" = "true" ]; then
            PAKSA="--paksa"
          fi

          # Saat dijalankan manual, kotak centang menentukan
          # apakah salinan Telegram ikut dikirim. Pada jadwal
          # otomatis, salinan selalu dikirim.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ inputs.kirim_telegram }}" != "true" ]; then
              export NOTIFY_TELEGRAM=0
            fi
          fi

          if [ "${{ inputs.uji }}" = "true" ]; then
            if [ "${{ inputs.tunggu }}" = "true" ]; then
              node scripts/notify-telegram.mjs --uji=tunggu
            else
              node scripts/notify-telegram.mjs --uji
            fi
          elif [ "${{ inputs.dry_run }}" = "true" ]; then
            node scripts/notify-telegram.mjs --dry-run --mode=$MODE $TANGGAL
          else
            node scripts/notify-telegram.mjs --mode=$MODE $TANGGAL $PAKSA
          fi
